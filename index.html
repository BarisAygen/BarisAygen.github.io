<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>Baris Aygen Blog</title>
</head>
<body class="d-flex justify-content-center">
    <div class="container text-center">
        <div id="profile">
            <img src="img/lalaland.png" id="profile-photo">
            <p>Baris Aygen Blog</p>
        </div>
        <div id="links" class="btn-group-vertical">
            <button id="linkedin-button" class="link-button">
                <img src="img/linkedin.png">
                <p>LinkedIn</p>
            </button>
            <button id="github-button" class="link-button">
                <img src="img/github.png">
                <p>GitHub</p>
            </button>
            <button id="instagram-button" class="link-button">
                <img src="img/Instagram.png">
                <p>Instagram</p>
            </button>
            <button id="spotify-button" class="link-button">
                <img src="img/Spotify.png">
                <p>Spotify</p>
            </button>
            <button id="vsco-button" class="link-button">
                <img src="img/vsco.png">
                <p>VSCO</p>
            </button>
            <button id="letterboxd-button" class="link-button">
                <img src="img/letterboxd.png">
                <p>Letterboxd</p>
            </button>
            <button id="blogger-button" class="link-button">
                <img src="img/Blogger.png">
                <p>Story Blog</p>
            </button>
        </div>
    </div>
    <script>
        document.getElementById('linkedin-button').addEventListener('click', () => {
            window.location.href = 'https://www.linkedin.com/in/bar%C4%B1%C5%9F-aygen-3ab03021a/'
        });
        document.getElementById('github-button').addEventListener('click', () => {
            window.location.href = 'https://github.com/BarisAygen'
        });
        document.getElementById('instagram-button').addEventListener('click', () => {
            window.location.href = 'https://www.instagram.com/barisaygn/'
        });
        document.getElementById('spotify-button').addEventListener('click', () => {
            window.location.href = 'https://open.spotify.com/user/2nkesc62rr7el7b37643s71e0?si=d0d64c45dbf14d50'
        });
        document.getElementById('vsco-button').addEventListener('click', () => {
            window.location.href = 'http://vsco.co/cinemelancholy?share=MTY5NzkxNTg1NQ%3D%3D'
        });
        document.getElementById('letterboxd-button').addEventListener('click', () => {
            window.location.href = 'https://letterboxd.com/barisaygn/'
        });
        document.getElementById('blogger-button').addEventListener('click', () => {
            window.location.href = 'https://peacemoongen.blogspot.com/'
        });
    </script>
    
</body>
</html>
